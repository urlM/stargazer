# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # Inject GITHUB_TOKEN from environment; defaults to empty string if unset.
    # The service treats empty string as "no token" — anonymous API access.
    App\Service\GitHubApiService:
        arguments:
            $githubToken: '%env(default::GITHUB_TOKEN)%'