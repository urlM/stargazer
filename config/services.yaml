# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    env(GITHUB_TOKEN): ''
    env(STARGAZER_TIMING): '0'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            bool $stargazerTimingEnabled: '%env(bool:STARGAZER_TIMING)%'

    App\:
        resource: '../src/'

    # Inject GITHUB_TOKEN from environment; defaults to empty string if unset.
    # The service treats empty string as "no token" — anonymous API access.
    App\Service\GitHubApiService:
        arguments:
            $githubToken: '%env(string:GITHUB_TOKEN)%'

    App\Command\WorkerHealthCommand:
        arguments:
            $messengerTransportDsn: '%env(string:MESSENGER_TRANSPORT_DSN)%'

    App\Logging\LogContextProcessor:
        tags:
            - { name: monolog.processor }
